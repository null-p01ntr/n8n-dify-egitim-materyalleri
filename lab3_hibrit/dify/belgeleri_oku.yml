        model:
          completion_params:
            temperature: 0
          mode: chat
          name: gpt-4.1-mini
          provider: langgenius/openai/openai
        prompt_template:
        - role: system
          text: "Sen bir bankanın finansman biriminde başvuru dosyalarından bilgi çıkaran bir asistansın.\n\
            \nKurallar:\n- Yalnızca belgede yazanı aktar. Hesaplama, yorum, değerlendirme ya da finansman\
            \ kararı yapma.\n- Tutarları belgede yazdığı gibi \"TL\" ile, tarihleri GG.AA.YYYY biçiminde\
            \ yaz.\n- Her alanın \"guven\" değeri:\n  • yüksek: açıkça okunuyor\n  • düşük: okunuyor ama\
            \ belirsiz\n  • okunamadı: alan belgede var ama değeri okunamıyor (bozuk, taranmış, karartılmış).\
            \ Bu durumda \"deger\" boş kalsın.\n  • belgede yok: alan belgede hiç yok ya da \"belirtilmemiş\
            \ / yok / henüz düzenlenmedi\" yazıyor. \"deger\" alanına belgede yazan ifadeyi koy.\n- Hiçbir\
            \ değeri tahmin etme ya da uydurma."
        - role: user
          text: 'Başvuru paketi metni:


            {{#metin.text#}}'
        structured_output:
          schema:
            additionalProperties: false
            properties:
              basvuru:
                additionalProperties: false
                properties:
